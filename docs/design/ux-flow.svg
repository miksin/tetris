<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <rect width="1000" height="730" fill="#ffffff"/>
  <text x="500" y="48" font-family="monospace" font-size="28" fill="#1e1e1e" text-anchor="middle">TETRIS — UX Flow Diagram</text>
  <!-- States -->
  <rect x="80" y="100" width="180" height="80" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="170" y="132" font-family="monospace" font-size="18" fill="#1e1e1e" text-anchor="middle">IDLE</text>
  <text x="170" y="158" font-family="monospace" font-size="13" fill="#1e1e1e" text-anchor="middle">(Landing Screen)</text>
  <rect x="400" y="100" width="180" height="80" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="490" y="148" font-family="monospace" font-size="20" fill="#1e1e1e" text-anchor="middle">PLAYING</text>
  <rect x="700" y="100" width="180" height="80" rx="12" fill="#ffd8a8" stroke="#e67700" stroke-width="2"/>
  <text x="790" y="148" font-family="monospace" font-size="20" fill="#1e1e1e" text-anchor="middle">PAUSED</text>
  <rect x="400" y="350" width="180" height="80" rx="12" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
  <text x="490" y="398" font-family="monospace" font-size="20" fill="#1e1e1e" text-anchor="middle">GAME OVER</text>
  <!-- Arrows -->
  <!-- Idle -> Playing -->
  <line x1="260" y1="140" x2="398" y2="140" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah)"/>
  <text x="320" y="132" font-family="monospace" font-size="14" fill="#1e1e1e" text-anchor="middle">Press SPACE</text>
  <!-- Playing -> Paused -->
  <line x1="580" y1="130" x2="698" y2="130" stroke="#e67700" stroke-width="2" marker-end="url(#ah)"/>
  <text x="638" y="122" font-family="monospace" font-size="14" fill="#1e1e1e" text-anchor="middle">Press P</text>
  <!-- Paused -> Playing -->
  <line x1="700" y1="165" x2="582" y2="165" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah)"/>
  <text x="638" y="185" font-family="monospace" font-size="14" fill="#1e1e1e" text-anchor="middle">Press P</text>
  <!-- Playing -> GameOver -->
  <line x1="490" y1="180" x2="490" y2="348" stroke="#c92a2a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="505" y="268" font-family="monospace" font-size="14" fill="#1e1e1e">Board fills up</text>
  <text x="505" y="288" font-family="monospace" font-size="14" fill="#1e1e1e">(top-out)</text>
  <!-- GameOver -> Playing (loop back) -->
  <path d="M400,390 L150,390 L150,140 L398,140" stroke="#2f9e44" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="148" y="380" font-family="monospace" font-size="14" fill="#1e1e1e" text-anchor="middle">Press SPACE</text>
  <!-- Arrow marker -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <!-- Controls Box -->
  <rect x="80" y="500" width="850" height="210" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
  <text x="505" y="528" font-family="monospace" font-size="20" fill="#1e1e1e" text-anchor="middle">Keyboard Controls</text>
  <text x="100" y="560" font-family="monospace" font-size="16" fill="#495057">LEFT / RIGHT — Move piece</text>
  <text x="100" y="585" font-family="monospace" font-size="16" fill="#495057">DOWN — Soft drop (faster fall)</text>
  <text x="100" y="610" font-family="monospace" font-size="16" fill="#495057">SPACE — Hard drop (instant)</text>
  <text x="100" y="635" font-family="monospace" font-size="16" fill="#495057">Z / UP — Rotate counterclockwise / clockwise</text>
  <text x="100" y="660" font-family="monospace" font-size="16" fill="#495057">C — Hold piece</text>
  <text x="520" y="560" font-family="monospace" font-size="16" fill="#495057">P — Pause / Resume</text>
  <text x="520" y="585" font-family="monospace" font-size="16" fill="#495057">SPACE (idle) — Start game</text>
  <text x="520" y="610" font-family="monospace" font-size="16" fill="#495057">SPACE (game over) — Restart</text>
  <text x="520" y="635" font-family="monospace" font-size="16" fill="#495057">ESC — Force pause</text>
  <text x="520" y="660" font-family="monospace" font-size="16" fill="#495057">R — Restart (from pause screen)</text>
</svg>
